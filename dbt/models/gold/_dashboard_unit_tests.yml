  # Incremental path: `this` already holds s1 (copy d1) and s3 (smaller copy d2). silver_scans now
  # keeps s1 from d1 (already loaded: no rows, so a re-run adds nothing), a new scan s2 (loaded) and
  # a larger copy d3 of s3 (re-processed in full, so the merge replaces s3's rows). A partial scan p1
  # is never loaded. The expectation is the batch the merge applies, not the merged table.
  - name: item_scan_value_incremental_batch
    model: item_scan_value
    description: "Incremental: only scans whose kept copy is not loaded yet are processed; a larger copy of a scan is recomputed over all of its listings."
    overrides:
      macros:
        is_incremental: true
    given:
